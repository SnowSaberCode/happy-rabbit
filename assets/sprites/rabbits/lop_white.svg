<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- 白色垂耳兔 - 像素风格 -->
  <!-- 身体 -->
  <rect x="20" y="32" width="24" height="20" fill="#f5f5f5" rx="4"/>
  <!-- 头 -->
  <rect x="18" y="20" width="28" height="24" fill="#ffffff" rx="6"/>
  <!-- 左耳（垂下） -->
  <rect x="16" y="8" width="10" height="18" fill="#ffffff" rx="3"/>
  <rect x="18" y="10" width="6" height="14" fill="#ffeeee" rx="2"/>
  <!-- 右耳（垂下） -->
  <rect x="38" y="8" width="10" height="18" fill="#ffffff" rx="3"/>
  <rect x="40" y="10" width="6" height="14" fill="#ffeeee" rx="2"/>
  <!-- 眼睛 -->
  <circle cx="25" cy="28" r="4" fill="#ff6b9d"/>
  <circle cx="39" cy="28" r="4" fill="#ff6b9d"/>
  <!-- 眼睛高光 -->
  <circle cx="26" cy="27" r="1.5" fill="#ffffff"/>
  <circle cx="40" cy="27" r="1.5" fill="#ffffff"/>
  <!-- 鼻子 -->
  <ellipse cx="32" cy="34" rx="3" ry="2" fill="#ffb6c1"/>
  <!-- 嘴巴 -->
  <path d="M 29 37 Q 32 40 35 37" stroke="#ffccd5" stroke-width="1.5" fill="none"/>
  <!-- 腮红 -->
  <circle cx="20" cy="34" r="4" fill="#ffb6c1" opacity="0.5"/>
  <circle cx="44" cy="34" r="4" fill="#ffb6c1" opacity="0.5"/>
  <!-- 脚 -->
  <rect x="22" y="50" width="8" height="6" fill="#eeeeee" rx="2"/>
  <rect x="34" y="50" width="8" height="6" fill="#eeeeee" rx="2"/>
  <!-- 尾巴 -->
  <circle cx="48" cy="42" r="5" fill="#ffffff"/>
</svg>
