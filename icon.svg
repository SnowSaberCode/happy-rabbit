<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- 游戏图标 - 可爱垂耳兔 -->
  <rect width="128" height="128" fill="#88c070" rx="16"/>

  <!-- 头 -->
  <ellipse cx="64" cy="68" rx="36" ry="32" fill="#b8b8b8"/>

  <!-- 左耳（垂下） -->
  <ellipse cx="34" cy="42" rx="12" ry="24" fill="#b8b8b8"/>
  <ellipse cx="36" cy="44" rx="8" ry="18" fill="#d0d0d0"/>

  <!-- 右耳（垂下） -->
  <ellipse cx="94" cy="42" rx="12" ry="24" fill="#b8b8b8"/>
  <ellipse cx="92" cy="44" rx="8" ry="18" fill="#d0d0d0"/>

  <!-- 眼睛 -->
  <circle cx="50" cy="62" r="7" fill="#2a2a2a"/>
  <circle cx="78" cy="62" r="7" fill="#2a2a2a"/>

  <!-- 眼睛高光 -->
  <circle cx="52" cy="60" r="2.5" fill="#ffffff"/>
  <circle cx="80" cy="60" r="2.5" fill="#ffffff"/>

  <!-- 鼻子 -->
  <ellipse cx="64" cy="74" rx="5" ry="3.5" fill="#ffb6c1"/>

  <!-- 嘴巴 -->
  <path d="M 56 82 Q 64 90 72 82" stroke="#888888" stroke-width="3" fill="none"/>

  <!-- 腮红 -->
  <circle cx="40" cy="74" r="6" fill="#ffb6c1" opacity="0.4"/>
  <circle cx="88" cy="74" r="6" fill="#ffb6c1" opacity="0.4"/>

  <!-- 身体 -->
  <ellipse cx="64" cy="100" rx="28" ry="20" fill="#a0a0a0"/>

  <!-- 尾巴 -->
  <circle cx="92" cy="96" r="10" fill="#d0d0d0"/>
</svg>
